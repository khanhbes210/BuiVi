<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>BÙI VỊ – Một miền vun đắp, một vị lưu hương</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages redirect
      // Converts deep link paths into query strings so index.html can restore the route
      var isGitHubIo = window.location.hostname.indexOf('github.io') !== -1;
      var pathSegmentsToKeep = isGitHubIo ? 1 : 0;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' : '') + l.search.slice(1).replace(/&/g, '~and~') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
